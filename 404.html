  <script>
    /* huevo de pascua: tres clics en el cráneo abren una puerta rara */
    (function () {
      var clics = 0;
      var calavera = document.getElementById("calavera");
      calavera.addEventListener("click", function () {
        clics++;
        if (clics === 1) toast && toast("💀 …");
        if (clics === 2) toast && toast("💀 …¿qué?");
        if (clics >= 3) {
          toast && toast("💀 ok ok, te llevo donde NO deberías ir");

        }
      });
    })();
